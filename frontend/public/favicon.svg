<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldGrad" x1="128" y1="20" x2="128" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldInnerGrad" x1="128" y1="40" x2="128" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Shape -->
  <path d="M128 32L52 60V114C52 165 84 212 128 228C172 212 204 165 204 114V60L128 32Z" fill="url(#shieldInnerGrad)" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Graph/Checkmark Concept -->
  <!-- Edges -->
  <path d="M100 125L120 145L165 95" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M100 125L70 95" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M165 95L180 140" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Nodes -->
  <circle cx="100" cy="125" r="10" fill="#38bdf8" />
  <circle cx="120" cy="145" r="10" fill="#f8fafc" />
  <circle cx="165" cy="95" r="10" fill="#38bdf8" />
  
  <!-- Floating Graph Nodes -->
  <circle cx="70" cy="95" r="6" fill="#67e8f9" opacity="0.8"/>
  <circle cx="180" cy="140" r="6" fill="#67e8f9" opacity="0.8"/>
</svg>